name: koinoxrista

services:
  app:
    image: koinoxrista:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8076}:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/instance/koinoxrista_app.db
      SECRET_KEY_FILE: /app/instance/flask_secret_key
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      PDF_FONT_PATH: /usr/share/fonts/dejavu/DejaVuSans.ttf
      PDF_FONT_BOLD_PATH: /usr/share/fonts/dejavu/DejaVuSans-Bold.ttf
    volumes:
      - app_data:/app/instance
      # For a one-time legacy import, uncomment the next line:
      # - ./koinoxrista.db:/app/koinoxrista.db:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  app_data:
