{% extends "base.html" %}
{% block content %}
<section class="card narrow" data-modal-content>
  <p class="eyebrow">{{ building.name }}</p>
  <h1>Νέα κατηγορία</h1>
  <form method="post" action="{{ request.path }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Ονομασία<input name="name" value="{{ request.form.get('name', '') }}" required></label>
    <h2>Χιλιοστά</h2>
    {% for apartment in apartments %}<label>{{ apartment.display_label() }}<input type="number" min="0" max="1000" name="a_{{ apartment.id }}" value="{{ request.form.get('a_%d'|format(apartment.id), 0) }}" required></label>{% endfor %}
    <p>Το άθροισμα πρέπει να είναι ακριβώς 1000.</p><button>Δημιουργία κατηγορίας</button>
  </form>
</section>
{% endblock %}
