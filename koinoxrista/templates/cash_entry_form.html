{% extends "base.html" %}
{% block title %}Νέα κίνηση ταμείου{% endblock %}
{% block content %}
<section class="card narrow" data-modal-content>
  <p class="eyebrow">{{ building.name }}</p>
  <h1>Νέα κίνηση ταμείου</h1>
  <form method="post" action="{{ url_for('main.cash_entry_new', building_id=building.id) }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="span-2">Διαμέρισμα<select name="apartment_id" required>
      <option value="">Επιλέξτε…</option>
      {% for apartment in apartments %}<option value="{{ apartment.id }}" {% if selected == apartment.id|string %}selected{% endif %}>{{ apartment.display_label() }} · οφειλή {{ suggested[apartment.id|string] }} €</option>{% endfor %}
    </select></label>
    <label>Είδος<select name="kind" required onchange="this.form.notes.placeholder = this.selectedOptions[0].dataset.notes">{% for key, label in kinds.items() %}<option value="{{ key }}" {% if selected_kind == key %}selected{% endif %} data-notes="{{ default_notes[key] }}">{{ label }}</option>{% endfor %}</select></label>
    <label>Ημερομηνία<input type="date" name="date" value="{{ request.form.get('date') or today.isoformat() }}" required></label>
    <label>Ποσό (€)<input type="number" step="0.01" min="0.01" name="amount" value="{{ request.form.get('amount') or ((credits if selected_kind == 'refund' else suggested)[selected] if selected in suggested and (credits if selected_kind == 'refund' else suggested)[selected] != '0.00' else '') }}" required></label>
    <label>Από / Προς <span class="optional-label">Προαιρετικό</span><input name="party_name" maxlength="100" value="{{ request.form.get('party_name', '') }}" placeholder="Ονοματεπώνυμο"></label>
    <label class="span-2">Αιτιολογία <span class="optional-label">Κενό = η προεπιλογή που φαίνεται</span><input name="notes" maxlength="200" value="{{ request.form.get('notes', '') }}" placeholder="{{ default_notes.get(selected_kind, default_notes['collection']) }}"></label>
    <button>Καταχώρηση και απόδειξη</button>
  </form>
</section>
{% endblock %}
