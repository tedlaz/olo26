{% extends "base.html" %}
{% block title %}Αλλαγή κωδικού{% endblock %}
{% block content %}
<section class="card narrow">
  <p class="eyebrow">Ασφάλεια λογαριασμού</p>
  <h1>Αλλαγή password</h1>
  {% if current_user.must_change_password %}<p>Η αλλαγή είναι υποχρεωτική πριν συνεχίσετε.</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Τρέχον password<input type="password" name="current_password" required></label>
    <label>Νέο password<input type="password" name="password" minlength="10" required></label>
    <label>Επιβεβαίωση<input type="password" name="confirm_password" minlength="10" required></label>
    <button>Αποθήκευση</button>
  </form>
</section>
{% endblock %}
