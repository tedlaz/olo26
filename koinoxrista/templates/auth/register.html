{% extends "base.html" %}
{% block title %}Εγγραφή{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">Πρόσκληση</p><h1>Δημιουργία λογαριασμού</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Ονοματεπώνυμο<input type="text" name="display_name" required></label>
    <label>Email<input type="email" name="email" value="{{ invitation.email or '' }}" {% if invitation.email %}readonly{% endif %} required></label>
    <label>Password<input type="password" name="password" minlength="10" required></label>
    <label>Επιβεβαίωση<input type="password" name="confirm_password" minlength="10" required></label>
    <button>Εγγραφή</button>
  </form>
</section>
{% endblock %}
